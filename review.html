<script>
(function(){
"use strict";
const names=["The Great Famine","The Black Death","The Hundred Years’ War","Social Unrest"];
const introductions=["In the early 1300s, heavy rain and poor harvests caused a famine in parts of Europe. Many people did not have enough food.","During the 1300s, a deadly disease called plague spread across Europe. This outbreak is called the Black Death. Many people became sick and died.","In 1337, a long conflict began between the kingdoms of England and France. It continued, with breaks, until 1453.","After famine, plague, and war, many people faced hardship. Some peasants protested taxes and unfair conditions."];
const words=[
[["Famine","A time when many people do not have enough food."],["Crop","A plant grown for food."],["Harvest","To gather crops when they are ready."],["Hunger","The feeling of needing food."]],
[["Plague","A serious disease that can spread among people."],["Disease","An illness that affects the body."],["Spread","To move from one place or person to another."],["Population","The number of people living in a place."]],
[["War","A conflict in which groups or countries fight."],["Kingdom","A country ruled by a king or queen."],["Conflict","A serious disagreement or fight."],["Territory","Land controlled by a country or ruler."]],
[["Peasant","A person who farmed land, often with little wealth."],["Tax","Money paid to a government or ruler."],["Revolt","When people rise up against authority."],["Unrest","A time of anger, protest, or disorder."]]];
const questions=[
[["What is a famine?","A time when food is scarce","A famine happens when many people do not have enough food."],["Why did some people go hungry?","Poor harvests","Bad weather damaged crops, so less food was available."],["What might happen after crops are damaged?","There may be less food","Damaged crops can mean less food for people."]],
[["What was the Black Death?","A deadly plague outbreak","The Black Death was a major outbreak of plague."],["What does spread mean?","Move to new places","A disease can spread between people or places."],["What happened to Europe’s population?","It decreased","Many people died, so the population fell."]],
[["Which kingdoms fought the Hundred Years’ War?","England and France","The war was between England and France."],["What is territory?","Land controlled by a ruler","Territory is land under someone’s control."],["Did the Hundred Years’ War end during the 1300s?","No","The war began in 1337 and ended in 1453."]],
[["What is a tax?","Money paid to a ruler or government","A tax is money collected by a government or ruler."],["Why did some peasants protest?","Unfair taxes and conditions","People protested hardship and unfair treatment."],["What does revolt mean?","Rise up against authority","A revolt happens when people resist those in power."]]];
const activities=[["vocab","Vocabulary Matching"],["cause","Cause & Effect"],["sequence","Sequencing"]];
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const n=Number(new URLSearchParams(location.search).get("lesson"))-1;
let saved={};try{saved=JSON.parse(localStorage.getItem("lwh-progress")||"{}")||{}}catch(_){}
const app=document.getElementById("app");
if(!Number.isInteger(n)||n<0||n>3){app.innerHTML='<section class="card"><h1>Lesson not found</h1><a href="./parent.html">Return to Parent Mode</a></section>';return}
const completed=questions[n].every((_,i)=>saved[n+"-"+i]?.correct)&&activities.every(([id])=>saved[n+"-"+id]?.correct);
if(!completed){app.innerHTML='<section class="card"><h1>Review not available yet</h1><p>This lesson is not marked complete on this device. Finish all three activities and three questions before reviewing.</p><a class="btn" href="./parent.html">Back to Parent Mode</a></section>';return}
app.innerHTML='<section class="card hero"><div class="tag">Read-only review · Completed lesson</div><h1>'+esc(names[n])+'</h1><p>Look back at the lesson, your completed activities, and the feedback you received. Reviewing does not change saved progress.</p><div class="actions"><a class="btn secondary" href="./parent.html">← Parent Mode</a><a class="btn secondary" href="./index.html#lesson-'+(n+1)+'">Open lesson story</a></div></section>'+
'<section class="card"><h2>Story</h2><p>'+esc(introductions[n])+'</p><h2>Vocabulary</h2>'+words[n].map(([w,d])=>'<div class="item"><strong>'+esc(w)+'</strong><p>'+esc(d)+'</p></div>').join('')+'</section>'+
'<section class="card"><h2>Completed activities</h2>'+activities.map(([id,label])=>'<div class="item"><strong>'+esc(label)+'</strong><p class="good">✓ Completed'+(saved[n+"-"+id]?.hint?' with a hint':'')+'</p><p class="muted">Individual matches or event selections were not recorded in the original attempt.</p></div>').join('')+'</section>'+
'<section class="card"><h2>Question results and feedback</h2>'+questions[n].map(([question,correct,feedback],i)=>{const r=saved[n+"-"+i];return '<div class="item"><strong>'+esc(question)+'</strong><p class="good">✓ Correct answer: '+esc(correct)+'</p><p>'+esc(feedback)+'</p><p class="muted">'+(r.independent?'Correct on the first try without hints':'Completed with support · '+Number(r.attempts||1)+' attempt(s)'+(r.hint?' · Hint used':''))+'</p><p class="warning">The original selected answer and earlier incorrect choices were not saved by this version of the lesson.</p></div>'}).join('')+'</section>'+
'<section class="card"><p class="muted">This review uses the results already stored in this browser. It does not create a new attempt or change the original results.</p><a class="btn" href="./parent.html">Back to Parent Mode</a></section>';
})();
</script></body></html>
