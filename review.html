<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review Lesson — Learn with H</title>
<style>
:root{font-family:system-ui,sans-serif;color:#24344e;background:#f3f7fc}*{box-sizing:border-box}body{margin:0}header{background:#103d75;color:white;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}header a{color:inherit}nav a{display:inline-block;padding:10px 14px;background:#e8f0fc;color:#18365c;border-radius:10px;text-decoration:none;font-weight:700;margin-left:8px}main{max-width:940px;margin:28px auto;padding:0 16px}.card{background:white;border-radius:20px;padding:24px;margin:16px 0;box-shadow:0 3px 14px #1a33501a}.hero{background:#e8f1ff}.tag{color:#255fa4;text-transform:uppercase;letter-spacing:.06em;font-size:.8rem;font-weight:800}h1{margin:12px 0}h2{font-size:1.3rem}.muted{color:#53677f}.item{border:1px solid #dce6f4;border-radius:14px;padding:16px;margin:12px 0}.good{color:#246343;font-weight:750}.warning{color:#865c18}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{display:inline-block;background:#245ca5;color:white;border-radius:12px;padding:12px 18px;text-decoration:none;font-weight:700}.btn.secondary{background:#e9eff8;color:#243d60}p{line-height:1.55}a:focus-visible{outline:4px solid #f7b84b;outline-offset:3px}
.review-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.review-grid .item{margin:0}.visual{min-height:120px;background:linear-gradient(135deg,#e3edfc,#fff5d5);border-radius:14px;display:grid;place-items:center;font-size:3.5rem;margin-bottom:12px}.step{margin:0 0 12px}.answer{background:#e8f7ed;border:2px solid #4b906b;border-radius:12px;padding:13px;margin:10px 0;color:#205a3b;font-weight:700}.locked{font-size:.88rem;color:#526783}.feedbackbox{background:#eef4ff;border-radius:12px;padding:12px;margin:10px 0}.activity{background:#f8faff}.activity .visual{min-height:80px;font-size:2.5rem}.missing{color:#865c18;font-size:.9rem}@media(max-width:650px){.review-grid{grid-template-columns:1fr}} </style></head><body><header><strong>📚 Learn with H <small>| Explore · Learn · Grow</small></strong><nav><a href="./learn.html">🏠 Home</a><a href="./parent.html">⚙ Parent Mode</a></nav></header><main id="app"></main>
<script>
(function(){
"use strict";
const names=["The Great Famine","The Black Death","The Hundred Years’ War","Social Unrest"];
const introductions=["In the early 1300s, heavy rain and poor harvests caused a famine in parts of Europe. Many people did not have enough food.","During the 1300s, a deadly disease called plague spread across Europe. This outbreak is called the Black Death. Many people became sick and died.","In 1337, a long conflict began between the kingdoms of England and France. It continued, with breaks, until 1453.","After famine, plague, and war, many people faced hardship. Some peasants protested taxes and unfair conditions."];
const words=[
[["Famine","A time when many people do not have enough food."],["Crop","A plant grown for food."],["Harvest","To gather crops when they are ready."],["Hunger","The feeling of needing food."]],
[["Plague","A serious disease that can spread among people."],["Disease","An illness that affects the body."],["Spread","To move from one place or person to another."],["Population","The number of people living in a place."]],
[["War","A conflict in which groups or countries fight."],["Kingdom","A country ruled by a king or queen."],["Conflict","A serious disagreement or fight."],["Territory","Land controlled by a country or ruler."]],
[["Peasant","A person who farmed land, often with little wealth."],["Tax","Money paid to a government or ruler."],["Revolt","When people rise up against authority."],["Unrest","A time of anger, protest, or disorder."]]];
const questions=[
[["What is a famine?","A time when food is scarce","A famine happens when many people do not have enough food."],["Why did some people go hungry?","Poor harvests","Bad weather damaged crops, so less food was available."],["What might happen after crops are damaged?","There may be less food","Damaged crops can mean less food for people."]],
[["What was the Black Death?","A deadly plague outbreak","The Black Death was a major outbreak of plague."],["What does spread mean?","Move to new places","A disease can spread between people or places."],["What happened to Europe’s population?","It decreased","Many people died, so the population fell."]],
[["Which kingdoms fought the Hundred Years’ War?","England and France","The war was between England and France."],["What is territory?","Land controlled by a ruler","Territory is land under someone’s control."],["Did the Hundred Years’ War end during the 1300s?","No","The war began in 1337 and ended in 1453."]],
[["What is a tax?","Money paid to a ruler or government","A tax is money collected by a government or ruler."],["Why did some peasants protest?","Unfair taxes and conditions","People protested hardship and unfair treatment."],["What does revolt mean?","Rise up against authority","A revolt happens when people resist those in power."]]];
const activities=[["vocab","Vocabulary Matching"],["cause","Cause & Effect"],["sequence","Sequencing"]];
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const n=Number(new URLSearchParams(location.search).get("lesson"))-1;
let saved={};try{saved=JSON.parse(localStorage.getItem("lwh-progress")||"{}")||{}}catch(_){}
const app=document.getElementById("app");
if(!Number.isInteger(n)||n<0||n>3){app.innerHTML='<section class="card"><h1>Lesson not found</h1><a href="./parent.html">Return to Parent Mode</a></section>';return}
const completed=questions[n].every((_,i)=>saved[n+"-"+i]?.correct)&&activities.every(([id])=>saved[n+"-"+id]?.correct);
if(!completed){app.innerHTML='<section class="card"><h1>Review not available yet</h1><p>This lesson is not marked complete on this device. Finish all three activities and three questions before reviewing.</p><a class="btn" href="./parent.html">Back to Parent Mode</a></section>';return}
const icons=[["🌧️","🌾","🌽","🍽️"],["🦠","🤒","↗️","👥"],["⚔️","👑","🏰","🗺️"],["🧑‍🌾","💰","✊","📜"]];
const scenes=["🌧️","🦠","🏰","📜"];
const activityIcons=["🧩","🔗","🔢"];
const detail=r=>r?.independent?"✓ Correct on the first try without hints":"Completed with support · "+Number(r?.attempts||1)+" attempt(s)"+(r?.hint?" · Hint used":"");
const vocabulary=words[n].map(([w,d],i)=>'<div class="item"><div class="visual" aria-hidden="true">'+icons[n][i]+'</div><h3>'+esc(w)+'</h3><p>'+esc(d)+'</p></div>').join('');
const activityCards=activities.map(([id,label],i)=>'<div class="item activity"><div class="visual" aria-hidden="true">'+activityIcons[i]+'</div><h3>'+esc(label)+'</h3><p class="good">✓ Completed'+(saved[n+"-"+id]?.hint?' with a hint':'')+'</p><p class="missing">Original matching and sequencing selections were not recorded for this attempt.</p><p class="locked">🔒 Read-only · Saved progress unchanged</p></div>').join('');
const questionCards=questions[n].map(([question,correct,feedback],i)=>{const r=saved[n+"-"+i];return '<div class="item"><div class="tag">Question '+(i+1)+' of '+questions[n].length+'</div><h3>'+esc(question)+'</h3><div class="answer">✓ Correct answer: '+esc(correct)+'</div><div class="feedbackbox"><strong>Feedback</strong><p>'+esc(feedback)+'</p></div><p class="muted">'+esc(detail(r))+'</p><p class="missing">H’s original selected answer and earlier incorrect choices were not stored in this attempt.</p><p class="locked">🔒 Read-only · Answers cannot be changed</p></div>'}).join('');
app.innerHTML='<section class="card hero"><div class="tag">Read-only review · Completed lesson</div><h1>'+esc(names[n])+'</h1><p>Review the same learning steps with answers and feedback shown. Your saved progress will not change.</p><div class="actions"><a class="btn secondary" href="./parent.html">← Parent Mode</a></div></section>'+
'<section class="card"><div class="tag step">Step 1 · Story</div><h2>'+esc(names[n])+'</h2><div class="visual" aria-hidden="true">'+scenes[n]+'</div><p>'+esc(introductions[n])+'</p></section>'+
'<section class="card"><div class="tag step">Step 2 · Vocabulary</div><h2>Learn 4 words</h2><div class="review-grid">'+vocabulary+'</div></section>'+
'<section class="card"><div class="tag step">Step 3 · Practice activities</div><h2>Completed activities</h2><div class="review-grid">'+activityCards+'</div></section>'+
'<section class="card"><div class="tag step">Step 4 · Check understanding</div><h2>Original question results</h2>'+questionCards+'</section>'+
'<section class="card"><p class="muted">This review displays saved results from this browser. Original selections that were not recorded cannot be reconstructed. Future lessons can capture those choices once answer recording is added.</p><a class="btn" href="./parent.html">Back to Parent Mode</a></section>';
})();
</script></body></html>
