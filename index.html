const units=[{name:'The Great Famine',icon:'🌾',intro:'In the early 1300s, heavy rain and poor harvests caused a famine in parts of Europe. Many people did not have enough food.',words:[['Famine','A time when many people do not have enough food.','🍞'],['Crop','A plant grown for food.','🌱'],['Harvest','To gather crops when they are ready.','🧺'],['Hunger','The feeling of needing food.','🥣']],questions:[['What is a famine?',['A time when food is scarce','A kind of castle','A long journey'],0,'A famine happens when many people do not have enough food.'],['Why did some people go hungry?',['Too many books','Poor harvests','Too many castles'],1,'Bad weather damaged crops, so less food was available.'],['What might happen after crops are damaged?',['There may be less food','More crops appear immediately','The river disappears'],0,'Damaged crops can mean less food for people.']]},{name:'The Black Death',icon:'🦠',intro:'During the 1300s, a deadly disease called plague spread across Europe. This outbreak is called the Black Death. Many people became sick and died.',words:[['Plague','A serious disease that can spread among people.','🦠'],['Disease','An illness that affects the body.','🤒'],['Spread','To move from one place or person to another.','↗️'],['Population','The number of people living in a place.','👥']],questions:[['What was the Black Death?',['A large building','A deadly plague outbreak','A farming tool'],1,'The Black Death was a major outbreak of plague.'],['What does spread mean?',['Move to new places','Stay in one place','Build a wall'],0,'A disease can spread between people or places.'],['What happened to Europe’s population?',['It decreased','It doubled overnight','It stayed exactly the same'],0,'Many people died, so the population fell.']]},{name:'The Hundred Years’ War',icon:'🏰',intro:'In 1337, a long conflict began between the kingdoms of England and France. It continued, with breaks, until 1453.',words:[['War','A conflict in which groups or countries fight.','⚔️'],['Kingdom','A country ruled by a king or queen.','👑'],['Conflict','A serious disagreement or fight.','🛡️'],['Territory','Land controlled by a country or ruler.','🗺️']],questions:[['Which kingdoms fought the Hundred Years’ War?',['England and France','Egypt and Rome','Spain and China'],0,'The war was between England and France.'],['What is territory?',['Land controlled by a ruler','A type of food','A disease'],0,'Territory is land under someone’s control.'],['Did the Hundred Years’ War end during the 1300s?',['Yes','No','It lasted only one day'],1,'The war began in 1337 and ended in 1453.']]},{name:'Social Unrest',icon:'📜',intro:'After famine, plague, and war, many people faced hardship. Some peasants protested taxes and unfair conditions.',words:[['Peasant','A person who farmed land, often with little wealth.','👩‍🌾'],['Tax','Money paid to a government or ruler.','🪙'],['Revolt','When people rise up against authority.','✊'],['Unrest','A time of anger, protest, or disorder.','📣']],questions:[['What is a tax?',['Money paid to a ruler or government','A type of crop','A kind of disease'],0,'A tax is money collected by a government or ruler.'],['Why did some peasants protest?',['Unfair taxes and conditions','They wanted more rain','They wanted taller castles'],0,'People protested hardship and unfair treatment.'],['What does revolt mean?',['Rise up against authority','Gather crops','Travel by boat'],0,'A revolt happens when people resist those in power.']]}];

const stories=[
 [{title:'Heavy rain',desc:'Heavy rain flooded fields in parts of Europe.',image:0},{title:'Damaged crops',desc:'Too much rain damaged crops and reduced harvests.',image:1},{title:'Food shortages',desc:'Markets had less food to sell.',image:2},{title:'People went hungry',desc:'Many families did not have enough to eat.',image:3}],
 [{title:'Plague arrived',desc:'Plague spread to Europe in the 1300s.'},{title:'Disease spread',desc:'The illness spread among communities.'},{title:'Many people died',desc:'Millions of people died during the outbreak.'},{title:'Population fell',desc:'There were fewer people living in many places.'}],
 [{title:'Conflict began',desc:'England and France disputed claims to land and the French throne.'},{title:'War started',desc:'Fighting began in 1337.'},{title:'War continued',desc:'The conflict continued, with pauses, for generations.'},{title:'War ended',desc:'The war ended in 1453.'}],
 [{title:'People faced hardship',desc:'Famine, disease, and war caused suffering.'},{title:'Taxes caused anger',desc:'Some people opposed taxes and unfair conditions.'},{title:'Peasants protested',desc:'Groups of peasants challenged authorities.'},{title:'Unrest followed',desc:'Some protests became revolts.'}]
];
const vocabPairs=[['Crop','Harvest','Famine','Hunger'],['Plague','Disease','Spread','Population'],['War','Kingdom','Conflict','Territory'],['Peasant','Tax','Revolt','Unrest']];
let matching={},selected='',seq=[],assist=false;
function imageTag(n,alt){return `<img class="history-img" src="${famineImages[n]}" alt="${esc(alt)}" loading="lazy">`}
function lesson(){const u=units[unit];if(step===0){app.innerHTML=`<section class="card"><div class="tag">Lesson ${unit+1} of 4</div><h1>${u.name}</h1>${unit===0?imageTag(0,'Medieval farmers inspect damaged crops in flooded fields'):`<div class="scene" aria-hidden="true">${u.icon}</div>`}<p class="big">${u.intro}</p><div class="row">${btn('🔊 Listen',`speak(${JSON.stringify(u.intro)})`)}${btn('Explore Visual Story →','step=1;lesson()','primary')}</div></section>`}
else if(step===1){app.innerHTML=`<section class="card"><div class="tag">Step 1 • Visual story</div><h1>${u.name}: What happened?</h1><p>Look at each scene. Read or listen to the short explanation.</p><div class="story-grid">${stories[unit].map((s,i)=>`<article class="story-card">${unit===0?imageTag(s.image,s.title):`<div class="story-number">${i+1}</div>`}<h2>${i+1}. ${s.title}</h2><p>${s.desc}</p>${btn('🔊 Listen',`speak(${JSON.stringify(s.desc)})`)}</article>`).join('')}</div><div class="row">${btn('← Back','step=0;lesson()')}${btn('Learn Vocabulary →','step=2;lesson()','primary')}</div></section>`}
else if(step===2){app.innerHTML=`<section class="card"><div class="tag">Step 2 • Vocabulary</div><h1>Learn 4 words</h1><p>Look, read, and listen. Then practice matching.</p><div class="story-grid">${u.words.map(([w,d,e],i)=>`<article class="story-card">${unit===0?imageTag([3,1,0,3][i],w):`<div class="story-number">${e}</div>`}<h2>${w}</h2><p>${d}</p>${btn('🔊 Listen',`speak(${JSON.stringify(w+'. '+d)})`)}</article>`).join('')}</div><div class="row">${btn('← Story','step=1;lesson()')}${btn('Start Matching →','step=3;matching={};selected="";lesson()','primary')}</div></section>`}
else if(step===3)matchActivity();else if(step===4)causeActivity();else if(step===5)sequenceActivity();else question()}
function matchActivity(){let u=units[unit];app.innerHTML=`<section class="card"><div class="tag">Step 3 • Picture and word matching</div><h1>Match each clue to a word</h1><p>Tap a clue, then tap its matching vocabulary word. A clue may describe what you see or what happens.</p><div class="match-grid"><div>${u.words.map(([w,d,e],i)=>`<button class="match-option ${selected==='clue'+i?'selected':''} ${matching[i]===i?'matched':''}" onclick="pickClue(${i})">${unit===0?`<img class="match-thumb" src="${famineImages[[3,1,0,3][i]]}" alt="Historical scene">`:`<span class="match-icon">${e}</span>`}<span>${esc(d)}</span></button>`).join('')}</div><div>${[2,0,3,1].map(i=>`<button class="match-option ${matching[i]===i?'matched':''}" onclick="pickWord(${i})">${esc(u.words[i][0])}</button>`).join('')}</div></div><div id="match-feedback" class="feedback" aria-live="polite">${Object.keys(matching).length} of 4 matched</div><div class="row">${btn('💡 Show a hint','assist=true;document.getElementById("match-feedback").textContent="Listen to a word and its meaning in the vocabulary section."')}${btn('← Vocabulary','step=2;lesson()')}${Object.keys(matching).length===4?btn('Cause & Effect →','step=4;matching={};selected="";lesson()','primary'):''}</div></section>`}
function pickClue(i){selected='clue'+i;matchActivity()}
function pickWord(i){if(!selected)return;let n=Number(selected.replace('clue',''));if(n===i){matching[i]=i;selected='';matchActivity();if(Object.keys(matching).length===4){record('vocab',assist)}}else{document.getElementById('match-feedback').textContent='Not quite. Try a different word.'}}
function causeActivity(){let ss=stories[unit];let pairs=ss.slice(0,3).map((s,i)=>({cause:s.desc,effect:ss[i+1].desc}));app.innerHTML=`<section class="card"><div class="tag">Step 4 • Cause and effect</div><h1>What happened next?</h1><p>Tap an event on the left, then the effect on the right.</p><div class="match-grid"><div>${pairs.map((x,i)=>`<button class="match-option ${selected==='cause'+i?'selected':''} ${matching[i]===i?'matched':''}" onclick="pickCause(${i})">${esc(x.cause)}</button>`).join('')}</div><div>${[2,0,1].map(i=>`<button class="match-option ${matching[i]===i?'matched':''}" onclick="pickEffect(${i})">${esc(pairs[i].effect)}</button>`).join('')}</div></div><div id="match-feedback" class="feedback" aria-live="polite">${Object.keys(matching).length} of 3 matched</div><div class="row">${btn('← Word matching','step=3;matching={};selected="";lesson()')}${Object.keys(matching).length===3?btn('Put Events in Order →','step=5;seq=[];lesson()','primary'):''}</div></section>`}
function pickCause(i){selected='cause'+i;causeActivity()}
function pickEffect(i){if(!selected)return;let n=Number(selected.replace('cause',''));if(n===i){matching[i]=i;selected='';causeActivity();if(Object.keys(matching).length===3)record('cause',false)}else document.getElementById('match-feedback').textContent='Try again. Think about what happened next.'}
function sequenceActivity(){let ss=stories[unit],order=[2,0,3,1];app.innerHTML=`<section class="card"><div class="tag">Step 5 • Sequencing</div><h1>Put the events in order</h1><p>Tap the events from FIRST to LAST. Your selected order appears below.</p><div class="story-grid">${order.map(i=>`<button class="story-card seq-card ${seq.includes(i)?'matched':''}" onclick="selectSeq(${i})" ${seq.includes(i)?'disabled':''}>${unit===0?imageTag(ss[i].image,ss[i].title):''}<strong>${ss[i].title}</strong><span>${ss[i].desc}</span></button>`).join('')}</div><h2>Your order</h2><div class="row">${seq.map((i,j)=>`<span class="order-chip">${j+1}. ${ss[i].title}</span>`).join('')||'Select the first event.'}</div><div id="seq-feedback" class="feedback" aria-live="polite">${seq.length} of 4 selected</div><div class="row">${btn('Reset order','seq=[];sequenceActivity()')}${btn('← Cause & effect','step=4;matching={};selected="";lesson()')}${seq.length===4?btn('Check order','checkSeq()','primary'):''}</div></section>`}
function selectSeq(i){if(!seq.includes(i)){seq.push(i);sequenceActivity()}}
function checkSeq(){if(seq.every((v,i)=>v===i)){record('sequence',false);document.getElementById('seq-feedback').innerHTML='✓ Great! You placed the events in the correct order. '+btn('Practice Questions →','step=6;q=0;attempt=0;help=false;answered=false;lesson()','primary')}else document.getElementById('seq-feedback').textContent='Not quite. Look at the visual story, then reset and try again.'}
function record(type,hinted){progress[unit+'-'+type]={correct:true,hint:hinted};save()}
function question(){let u=units[unit];let item=u.questions[q];let opts=item[1].map((label,i)=>({label,i})).filter((x,i)=>!two||i===item[2]||i===((item[2]+1)%3));app.innerHTML=`<section class="card"><div class="tag">Step 2 • Comprehension</div><h1>${u.name}</h1><p class="muted">Question ${q+1} of ${u.questions.length}</p><div class="progress"><div style="width:${q/u.questions.length*100}%"></div></div><h2 class="big">${item[0]}</h2>${btn('🔊 Listen',`speak(${JSON.stringify(item[0])})`)}<div id="choices">${opts.map(o=>`<button class="choice" onclick="choose(${o.i})">${esc(o.label)}</button>`).join('')}</div><div id="feedback" aria-live="polite"></div><div class="row" style="margin-top:15px">${btn('💡 Hint','hint()')}${btn('📖 Review Words','step=1;lesson()')}${btn('🏠 Home','home()')}</div></section>`}
function hint(){help=true;document.getElementById('feedback').innerHTML='<div class="feedback">Think about the story. You can listen to it again or review the words.</div>'}function choose(i){if(answered)return;let item=units[unit].questions[q];attempt++;if(i===item[2]){answered=true;let key=unit+'-'+q;progress[key]={correct:true,independent:attempt===1&&!help,attempts:attempt,hint:help};save();document.getElementById('feedback').innerHTML=`<div class="feedback">✅ Yes! ${item[3]}</div><p>${btn(q===units[unit].questions.length-1?'Finish Lesson ✓':'Next Question →','next()','primary')}</p>`}else{document.getElementById('feedback').innerHTML='<div class="feedback">Not quite. Try again. You can use a hint or review the words.</div>'}}function next(){q++;attempt=0;help=false;answered=false;if(q>=units[unit].questions.length){progress[unit]={done:true};save();app.innerHTML=`<section class="card" style="text-align:center"><div style="font-size:4rem">⭐</div><h1>Lesson Complete!</h1><p class="big">You practiced ${units[unit].name}.</p><div class="row" style="justify-content:center">${btn('Practice Again',`start(${unit})`)}${btn('Choose Another Lesson','home()','primary')}</div></section>`}else question()}
function parent(){let total=Object.keys(progress).filter(k=>/^\d+-\d+$/.test(k)).length;let independent=Object.keys(progress).filter(k=>/^\d+-\d+$/.test(k)&&progress[k].independent).length;app.innerHTML=`<section class="card"><div class="tag">Parent / Guided Learning</div><h1>Learning Dashboard</h1><p>Progress is saved in this browser on this device only. It does not sync between the iPad and computer.</p><p><strong>Questions completed:</strong> ${total} / 12<br><strong>Correct on first try without hints:</strong> ${independent}<br><strong>Matching activities completed:</strong> ${Object.keys(progress).filter(k=>k.includes("-vocab")||k.includes("-cause")||k.includes("-sequence")).length} / 12<br><strong>Lessons practiced:</strong> ${units.filter((u,i)=>progress[i]?.done).length} / 4</p><label class="row"><input type="checkbox" ${two?'checked':''} onchange="two=this.checked;localStorage.setItem('lwh-two',two)"> Show only 2 answer choices (easier)</label><h2>Question details</h2>${units.map((u,i)=>`<h3>${u.icon} ${u.name}</h3>${u.questions.map((it,j)=>`<p>${j+1}. ${esc(it[0])}<br><span class="muted">${progress[i+'-'+j]?(progress[i+'-'+j].independent?'✓ Independent':`✓ With support / ${progress[i+'-'+j].attempts} attempt(s)`):'Not practiced yet'}</span></p>`).join('')}`).join('')}<div class="row">${btn('Return Home','home()','primary')}${btn('Clear Progress','reset()')}</div></section>`}function reset(){if(confirm('Clear all saved progress on this device?')){progress={};save();parent()}}home();
;window.addEventListener('load',openHashLesson);
</script></body></html>
