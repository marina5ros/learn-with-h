name: QA profile isolation checks
on:
  pull_request:
    paths:
      - 'profile-storage.js'
      - 'tests/profile-storage.test.mjs'
      - '.github/workflows/qa-profile-checks.yml'
  workflow_dispatch:
jobs:
  storage-isolation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test student and QA storage separation
        run: node --test tests/profile-storage.test.mjs
